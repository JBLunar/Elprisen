<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline – Elprisen lige nu</title>
  <!-- Styles ligger her i filen, så siden virker helt uden andre filer -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background-color: #201E1E;
      color: #EBEBEB;
      font-family: 'Roboto', sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    h1 {
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .highlight { color: #55EC20; }
    button {
      background: none;
      border: 1px solid #55EC20;
      color: #55EC20;
      padding: 0.6rem 1.5rem;
      border-radius: 0.25rem;
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Du er offline</h1>
  <p>Elprisen kunne ikke hentes, fordi der <span class="highlight">ingen internetforbindelse</span> er.</p>
  <!-- Prøv igen = genindlæs siden -->
  <button onclick="location.reload()">Prøv igen</button>
</body>
</html>
